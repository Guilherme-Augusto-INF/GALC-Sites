name: Prepare official GALC brand assets
on:
  push:
    branches: [feat/galc-v2-5-official-logo]
    paths: [.github/workflows/prepare-brand.yml, tools/build_brand_assets.py]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install image preparation tool
        run: python3 -m pip install --disable-pip-version-check Pillow
      - name: Prepare and inspect exact-source derivatives
        run: python3 tools/build_brand_assets.py
      - name: Validate existing contact regressions
        run: node --test tests/form-flow.test.cjs
