name: Verify official GALC brand
on:
  push:
    branches: [feat/galc-v2-5-official-logo]
    paths: [.github/workflows/verify-brand.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: node --test tests/form-flow.test.cjs
      - name: Validate files and deployed image headers
        run: |
          python3 - <<'PY'
          import json, struct, subprocess
          from pathlib import Path
          for path in ["index.html","privacidade.html","termos.html"]:
              text=Path(path).read_text()
              assert "brand-symbol" not in text, path
              assert "galc-symbol-v25-96.png" in text, path
          assert 'id="quoteSimulator"' in Path("index.html").read_text()
          for name,expected in [("galc-symbol-v25-96.png",(96,96)),("favicon-v25-32.png",(32,32)),("favicon-v25-64.png",(64,64)),("apple-touch-icon-v25.png",(180,180)),("og-image-v25.png",(1200,630))]:
              data=Path("img",name).read_bytes()
              assert data[:8]==bytes([137,80,78,71,13,10,26,10])
              assert struct.unpack(">II",data[16:24])==expected
              result=subprocess.run(["curl","--silent","--show-error","--head","--max-time","20","https://0467eb07.galc-sites.pages.dev/img/"+name],check=True,capture_output=True,text=True)
              block=result.stdout.strip().split("\n\n")[-1]
              lines=block.splitlines()
              status=int(lines[0].split()[1])
              headers={k.lower():v.strip() for line in lines[1:] if ":" in line for k,v in [line.split(":",1)]}
              ttl=headers.get("cache-control","")
              assert status==200, result.stdout
              assert "31536000" in ttl and "immutable" in ttl,ttl
              assert headers.get("content-type","").startswith("image/png")
              print("RESOURCE_CHECK="+json.dumps({"path":name,"status":status,"cache":ttl,"bytes":len(data),"size":expected}))
          PY
