name: GALC navigation quality checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser JavaScript syntax
        run: |
          for file in js/*.js; do node --check "$file"; done
      - name: Run zero-dependency regression tests
        run: node --test tests/*.test.cjs
